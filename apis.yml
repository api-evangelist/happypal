name: Happypal
description: >-
  Happypal (HappyPal) is a Paris-based HR-tech and fintech company, founded in
  2019, that operates the most widely used digital platform for French works
  councils (Comite Social et Economique, or CSE). The SaaS and payment platform
  lets CSE administrators distribute employee benefits and perks, manage budgets
  and accounting, run ticketing and gift-voucher (cheques-cadeaux) programs, and
  engage more than 500,000 beneficiaries through a mobile app. Happypal replaces
  paper gift vouchers with a dematerialized SaaS-plus-fintech model targeting
  France's employee-benefits market. It is a portfolio company of Anthemis.
  Happypal does not currently publish a public developer portal, API reference,
  or SDKs; this profile captures its public web and identity surface.
